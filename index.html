<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Budget</title>
<meta name="description" content="Track spending, monthly budgets and your cash schedule. Everything stays on this device.">
<meta name="theme-color" content="#f3f2ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: one phone-width column of plain panels; month switcher on top, tab bar at the bottom. Colours follow the app icon. */
:root {
  --bg: #f3f2ee;
  --surface: #ffffff;
  --surface-2: #f6f5f1;
  --line: #e2e0d9;
  --ink: #1d1c19;
  --muted: #6e6b63;
  --track: #e9e7e0;
  --accent: #17695a;
  --accent-ink: #ffffff;
  --accent-soft: #e2eee9;
  --gold: #a87a22;
  --gold-soft: #f4ead6;
  --good: #2e7d4f;
  --warn: #a5660f;
  --bad: #b3361f;
  --scrim: rgba(20, 20, 15, .4);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121311; --surface: #1b1c1a; --surface-2: #232421; --line: #2f312d; --ink: #e9e8e3; --muted: #9b998f; --track: #2c2e2a;
    --accent: #5fb89c; --accent-ink: #0f1f19; --accent-soft: rgba(95, 184, 156, .14); --gold: #d6a952; --gold-soft: rgba(214, 169, 82, .14);
    --good: #6cc08c; --warn: #d9a44a; --bad: #e26a52; --scrim: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121311; --surface: #1b1c1a; --surface-2: #232421; --line: #2f312d; --ink: #e9e8e3; --muted: #9b998f; --track: #2c2e2a;
  --accent: #5fb89c; --accent-ink: #0f1f19; --accent-soft: rgba(95, 184, 156, .14); --gold: #d6a952; --gold-soft: rgba(214, 169, 82, .14);
  --good: #6cc08c; --warn: #d9a44a; --bad: #e26a52; --scrim: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body { min-height: 100vh; color: var(--ink); background: var(--bg); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3, p { margin: 0; }
h2 { font-size: 1.25rem; font-weight: 650; letter-spacing: -.01em; }
h3 { font-size: 1rem; font-weight: 600; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tiny { font-size: .78rem; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.row { display: flex; align-items: center; gap: 8px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.spacer { flex: 1; }
.ico { width: 22px; height: 22px; flex: none; }
.ico-sm { width: 18px; height: 18px; flex: none; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding-block: 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 4px; }
.month-pill { display: flex; align-items: center; }
.month-pill button { font: inherit; border: 0; background: transparent; color: var(--ink); cursor: pointer; border-radius: 8px; }
.month-pill .arrow { width: 36px; height: 36px; font-size: 1.3rem; color: var(--muted); }
.month-pill .label { font-weight: 650; font-size: 1.05rem; padding: 6px 6px; }
.month-pill button:hover { background: var(--surface-2); }
.icon-btn { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: var(--ink); background: transparent; border: 0; font-size: 1rem; }
.icon-btn:hover { background: var(--surface-2); }

main.wrap { padding-block: 14px 100px; display: flex; flex-direction: column; gap: 12px; }

/* Panels */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.link-btn { font: inherit; font-weight: 600; font-size: .88rem; color: var(--accent); background: transparent; border: 0; cursor: pointer; padding: 4px 0; }

/* Month summary */
.big { font-size: 2.1rem; font-weight: 650; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.meter { position: relative; height: 8px; border-radius: 4px; background: var(--track); }
.meter i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
.meter i.warn { background: var(--warn); }
.meter i.over { background: var(--bad); }
.meter b { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); opacity: .55; }
.figures { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); padding-top: 12px; }
.figures div { display: flex; flex-direction: column; gap: 2px; padding-left: 12px; border-left: 1px solid var(--line); }
.figures div:first-child { padding-left: 0; border-left: 0; }
.figures b { font-size: 1rem; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Lists */
.list { display: flex; flex-direction: column; margin: -4px 0; }
.line-item {
  width: 100%; display: flex; flex-direction: column; gap: 6px; padding: 11px 0; font: inherit; color: inherit; text-align: left;
  background: transparent; border: 0; border-top: 1px solid var(--line); cursor: pointer;
}
.line-item:first-child { border-top: 0; }
.line-item .top-line { display: flex; align-items: center; gap: 10px; }
.line-item .name { flex: 1; min-width: 0; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--c); }
.kind { font-size: .75rem; color: var(--muted); }
.bar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c, var(--accent)); }
.bar i.warn { background: var(--warn); }
.bar i.over { background: var(--bad); }
.check { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--muted); display: grid; place-items: center; flex: none; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Activity */
.tx-group { display: flex; flex-direction: column; }
.tx-day { display: flex; justify-content: space-between; padding: 12px 2px 6px; font-size: .85rem; font-weight: 600; color: var(--muted); }
.tx-list { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
.tx-list.flat { border: 0; border-radius: 0; background: transparent; margin: -4px 0; }
.tx {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 56px;
  font: inherit; color: inherit; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; cursor: pointer;
}
.tx-list.flat .tx { padding-inline: 0; }
.tx:first-child { border-top: 0; }
.tx:hover { background: var(--surface-2); }
.tx-ico { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; flex: none; color: var(--c); background: var(--surface-2); }
.tx-meta { flex: 1; min-width: 0; }
.tx-title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-sub { font-size: .82rem; color: var(--muted); }
.tx-amt { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: inherit; font-size: .85rem; font-weight: 550; padding: 6px 12px; border-radius: 999px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.chip[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Stats */
.split { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--track); gap: 2px; }
.split i { display: block; height: 100%; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 7px 0; font-size: .92rem; }
.kv b { padding-left: 12px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.kv .total { border-top: 1px solid var(--line); padding-top: 7px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 10.5px var(--font); }
.chart .grid { stroke: var(--line); }
.leg-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.leg-row span { display: inline-flex; align-items: center; gap: 6px; }
.leg-row i { width: 14px; height: 0; border-top: 2px solid; display: inline-block; }

/* Cash */
.pay { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.pay:first-child { border-top: 0; }
.pay-tag { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: .85rem; flex: none; }
.pay-tag.A { background: var(--accent-soft); color: var(--accent); }
.pay-tag.B { background: var(--gold-soft); color: var(--gold); }
.status { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.status.got { color: var(--good); }
.status.next { color: var(--gold); font-weight: 600; }

.empty { text-align: center; color: var(--muted); padding: 16px 8px; font-size: .9rem; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.notice { padding: 12px 14px; border-radius: 10px; font-size: .88rem; background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); }
.notice.topup { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }

/* Buttons & inputs */
.btn { font: inherit; font-weight: 600; min-height: 44px; padding: 0 16px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn-primary { border-color: var(--accent); color: var(--accent-ink); background: var(--accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-danger { background: transparent; color: var(--bad); border-color: transparent; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: .88rem; }
.btn-block { width: 100%; }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: .85rem; font-weight: 550; color: var(--muted); min-width: 0; }
input, select { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; min-height: 44px; padding: 9px 11px; width: 100%; min-width: 0; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); }
.seg button { flex: 1; font: inherit; font-weight: 550; padding: 7px 8px; border-radius: 6px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.amount-input { font-size: 2rem; font-weight: 650; text-align: center; min-height: 60px; font-variant-numeric: tabular-nums; }
.cat-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.cat-pick button {
  font: inherit; font-size: .82rem; font-weight: 550; color: var(--ink); cursor: pointer; padding: 9px 4px; border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); min-width: 0;
}
.cat-pick button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-pick button i { color: var(--c); display: grid; place-items: center; }
.cat-pick button[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.zero-btn { display: flex; align-items: center; justify-content: center; gap: 8px; }
/* Slip import */
.slip-row { padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.slip-row.off { opacity: .6; }
.slip-thumb { width: 64px; border-radius: 6px; border: 1px solid var(--line); flex: none; }
.slip-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 8px; }

/* Plan editor */
.plan-cat { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.plan-cat .line { display: grid; grid-template-columns: 44px minmax(0, 1fr) 110px; gap: 8px; align-items: center; }
.plan-cat .line2 { display: flex; gap: 8px; align-items: center; }
.swatch-btn { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--c); background: var(--surface); cursor: pointer; }
.picker { display: flex; flex-direction: column; gap: 8px; }
.picker .icons, .picker .colors { display: flex; flex-wrap: wrap; gap: 6px; }
.picker .icons button { width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.picker .colors button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--c); cursor: pointer; }
.picker button[aria-pressed=true] { outline: 2px solid var(--ink); outline-offset: 2px; }
.fixed-line { display: grid; grid-template-columns: minmax(0, 1fr) 120px 40px; gap: 8px; align-items: center; }
.x-btn { width: 40px; height: 40px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); font-size: 1.05rem; cursor: pointer; }
.x-btn:hover { color: var(--bad); }
.checkline { font-size: .88rem; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.section-label { font-size: .9rem; font-weight: 650; padding-top: 6px; }

/* Bottom nav */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px max(8px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
.nav-inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.nav-btn { font: inherit; font-size: .7rem; font-weight: 550; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.nav-btn[aria-current=page] { color: var(--accent); }
.plus { justify-self: center; width: 46px; height: 40px; border-radius: 10px; border: 0; cursor: pointer; color: var(--accent-ink); background: var(--accent); display: grid; place-items: center; }
.plus svg { width: 24px; height: 24px; }

/* Sheets */
dialog {
  width: 100%; max-width: 560px; max-height: 92dvh; margin: auto auto 0; padding: 0; overflow: hidden;
  border: 1px solid var(--line); border-bottom: 0; border-radius: 14px 14px 0 0; background: var(--surface); color: var(--ink);
}
dialog.center { margin: auto; border-radius: 12px; border-bottom: 1px solid var(--line); width: min(400px, calc(100% - 32px)); }
dialog::backdrop { background: var(--scrim); }
.sheet { display: flex; flex-direction: column; gap: 14px; padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; max-height: 92dvh; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--track); align-self: center; margin-top: -6px; }
.error { color: var(--bad); font-size: .88rem; min-height: 1.1em; }

.toast {
  position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 30; transform: translate(-50%, 8px); opacity: 0;
  transition: opacity .15s, transform .15s; pointer-events: none; padding: 10px 14px; border-radius: 8px; font-size: .9rem;
  background: var(--ink); color: var(--bg); max-width: calc(100vw - 32px); text-align: center;
  display: flex; align-items: center; gap: 14px;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.show.actionable { pointer-events: auto; }
.toast-btn { font: inherit; font-weight: 650; color: inherit; background: transparent; border: 0; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; flex: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="month-pill">
      <button class="arrow" id="prevMonth" aria-label="Previous month">‹</button>
      <button class="label" id="monthLabel" title="Back to this month"></button>
      <button class="arrow" id="nextMonth" aria-label="Next month">›</button>
    </div>
    <span class="spacer"></span>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings"></button>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="nav" aria-label="Main">
  <div class="nav-inner">
    <button class="nav-btn" data-tab="home"></button>
    <button class="nav-btn" data-tab="activity"></button>
    <button class="plus" id="addBtn" aria-label="Add spending"></button>
    <button class="nav-btn" data-tab="wallet"></button>
    <button class="nav-btn" data-tab="stats"></button>
  </div>
</nav>

<dialog id="txSheet"><form class="sheet" id="txForm" novalidate></form></dialog>
<dialog id="planSheet"><div class="sheet" id="planBody"></div></dialog>
<dialog id="settingsSheet"><div class="sheet" id="settingsBody"></div></dialog>
<dialog id="setupSheet"><form class="sheet" id="setupForm" novalidate></form></dialog>
<dialog id="slipSheet"><div class="sheet" id="slipBody"></div></dialog>
<dialog id="confirmSheet" class="center"><div class="sheet">
  <p id="confirmText"></p>
  <div class="row"><span class="spacer"></span><button class="btn" id="confirmNo" type="button">Cancel</button><button class="btn btn-primary" id="confirmYes" type="button">OK</button></div>
</div></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* dates (local calendar dates as YYYY-MM-DD strings) */

// Reverses one add, edit or delete: takes `added` back out and puts `removed` back in
function undoTx(added, removed) {
  for (const t of added) removeTx(t);
  for (const t of removed) { const m = t.date.slice(0, 7); D.tx[m] = txOf(m).concat(t); }
  commit(); toast('Undone');
}
async function deleteTx(t) {
  $('#txSheet').close();
  if (!(await askConfirm(`Delete ${t.zero ? 'this Zero Day' : `“${t.note || catInfo(t.cat, t.date.slice(0, 7)).name}” (${money(Math.abs(t.amount))})`}?`, 'Delete'))) return;
  removeTx(t); commit(); toast('Deleted', () => undoTx([], [t]));
}
function logZero(date) {
  if (!isDate(date)) { toast('Pick a date first.'); return; }
  const m = date.slice(0, 7);
  const same = txOf(m).filter((x) => x.date === date);
  if (same.some((x) => x.zero)) { toast(`${dayLabel(date)} is already a Zero Day`); return; }
  if (same.some((x) => x.amount > 0)) { toast(`You already logged spending on ${dayLabel(date)}`); return; }
  const z = { id: uid('z'), date, note: 'Zero Day', cat: null, amount: 0, zero: true, created: Date.now() };
  D.tx[m] = txOf(m).concat(z);
  $('#txSheet').close();
  commit();
  toast(`Zero Day logged for ${dayLabel(date)}`, () => undoTx([z], []));
}
function openZero(t) {
  const f = $('#txForm');
  f.replaceChildren(h('div', { class: 'grab' }), h('h2', null, 'Zero Day'), h('p', { class: 'muted' }, `${niceDate(t.date, true)}: you logged that you spent nothing.`),
    h('div', { class: 'row' }, h('button', { class: 'btn btn-danger', type: 'button', onclick: () => deleteTx(t) }, 'Remove'), h('span', { class: 'spacer' }), h('button', { class: 'btn', type: 'button', onclick: () => $('#txSheet').close() }, 'Close')));
  f.onsubmit = (e) => e.preventDefault();
  $('#txSheet').showModal();
}

/* =================================================================== plan editor */
function openPlan() {
  const m = S.month;
  const draft = clone(planFor(m));
  const body = $('#planBody');
  let openPicker = null;
  const draw = () => {
    const assigned = catsTotal(draft), diff = draft.variable - assigned;
    const variable = h('input', { id: 'planVariable', inputmode: 'decimal', value: centsIn(draft.variable), 'aria-label': 'Monthly spending budget' });
    variable.addEventListener('change', () => { const c = parseAmount(variable.value); if (c !== null) draft.variable = c; else variable.value = centsIn(draft.variable); draw(); });
    const cats = draft.cats.map((c, i) => {
      const name = h('input', { id: 'catName-' + c.id, value: c.name, maxlength: '24', 'aria-label': 'Category name' });
      name.addEventListener('change', () => { c.name = name.value.trim() || c.name; });
      const bud = h('input', { id: 'catBudget-' + c.id, inputmode: 'decimal', value: centsIn(c.budget), style: { textAlign: 'right' }, 'aria-label': `Budget for ${c.name}` });
      bud.addEventListener('change', () => { const v = bud.value.trim() === '' ? 0 : parseAmount(bud.value); if (v !== null) c.budget = v; draw(); });
      const nw = h('div', { class: 'seg', style: { flex: '1' } }, ['need', 'want'].map((k) => h('button', { type: 'button', 'aria-pressed': String(c.type === k), onclick: () => { c.type = k; draw(); } }, k === 'need' ? 'Need' : 'Want')));
      const picker = openPicker === c.id ? h('div', { class: 'picker' },
        h('div', { class: 'icons' }, CAT_ICONS.map((ic) => h('button', { type: 'button', 'aria-pressed': String(c.icon === ic), 'aria-label': ic, onclick: () => { c.icon = ic; draw(); } }, icon(ic, 'ico-sm')))),
        h('div', { class: 'colors' }, Object.keys(COLORS).map((k) => h('button', { type: 'button', style: { '--c': COLORS[k] }, 'aria-pressed': String(c.color === k), 'aria-label': k, onclick: () => { c.color = k; draw(); } })))) : null;
      return h('div', { class: 'plan-cat' },
        h('div', { class: 'line' },
          h('button', { class: 'swatch-btn', type: 'button', style: { '--c': colorOf(c.color) }, 'aria-label': 'Change icon and colour', onclick: () => { openPicker = openPicker === c.id ? null : c.id; draw(); } }, icon(c.icon, 'ico-sm')),
          name, bud),
        picker,
        h('div', { class: 'line2' }, nw, h('button', { class: 'x-btn', type: 'button', 'aria-label': `Remove ${c.name}`, onclick: () => { draft.cats.splice(i, 1); draw(); } }, '✕')));
    });
    const fixed = draft.fixed.map((f, i) => {
      const name = h('input', { id: 'fixName-' + f.id, value: f.name, maxlength: '24', 'aria-label': 'Fixed cost name' });
      name.addEventListener('change', () => { f.name = name.value.trim() || f.name; });
      const amt = h('input', { id: 'fixAmt-' + f.id, inputmode: 'decimal', value: centsIn(f.amount), style: { textAlign: 'right' }, 'aria-label': `Amount for ${f.name}` });
      amt.addEventListener('change', () => { const v = parseAmount(amt.value); if (v !== null) f.amount = v; draw(); });
      return h('div', { class: 'fixed-line' }, name, amt, h('button', { class: 'x-btn', type: 'button', 'aria-label': `Remove ${f.name}`, onclick: () => { draft.fixed.splice(i, 1); draw(); } }, '✕'));
    });
    body.replaceChildren(
      h('div', { class: 'grab' }),
      h('div', { class: 'between' }, h('h2', null, `Plan from ${monthName(m)}`), h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close', onclick: () => $('#planSheet').close() }, '✕')),
      h('p', { class: 'small muted' }, 'Changes apply to this month and carry into the following months. Earlier months keep their own plan.'),
      h('label', { class: 'field' }, 'Monthly spending budget', variable),
      h('div', { class: 'section-label' }, 'Categories'),
      ...cats,
      h('button', { class: 'btn btn-sm', type: 'button', onclick: () => { const used = new Set(draft.cats.map((c) => c.color)); draft.cats.push({ id: uid('c'), name: 'New category', type: 'want', budget: 0, icon: 'gift', color: Object.keys(COLORS).find((k) => !used.has(k)) || 'teal' }); draw(); } }, '+ Add category'),
      h('div', { class: 'checkline ' + (diff === 0 ? 'good' : 'warn') }, diff === 0 ? `✓ Categories add up to ${moneyW(assigned)}` : diff > 0 ? `Categories add up to ${moneyW(assigned)}: ${moneyW(diff)} not assigned yet` : `Categories add up to ${moneyW(assigned)}: ${moneyW(-diff)} more than your budget`),
      h('div', { class: 'section-label' }, 'Fixed costs'),
      ...fixed,
      h('button', { class: 'btn btn-sm', type: 'button', onclick: () => { draft.fixed.push({ id: uid('f'), name: 'New cost', amount: 0, icon: 'home' }); draw(); } }, '+ Add fixed cost'),
      cashOn() ? h('div', { class: 'kv card' }, ...planRows(draft, m)) : null,
      h('button', { class: 'btn btn-primary btn-block', type: 'button', onclick: () => {
        document.activeElement && document.activeElement.blur();
        setTimeout(() => {
          if (!draft.cats.length) { toast('Keep at least one category.'); return; }
          D.plans[m] = clone(draft); $('#planSheet').close(); commit(); toast('Plan saved');
        }, 30);
      } }, 'Save plan'));
  };
  draw();
  $('#planSheet').showModal();
}

/* =================================================================== settings & setup */
// Cash inputs shared by Settings and the welcome sheet. read() returns the new cash setup, null when the amounts are blank, or an error message.
function cashFields() {
  const c = D.cash, on = cashOn();
  const A = h('input', { inputmode: 'decimal', value: on && c.A ? centsIn(c.A) : '', placeholder: '0' });
  const B = h('input', { inputmode: 'decimal', value: on && c.B ? centsIn(c.B) : '', placeholder: '0' });
  const start = h('input', { type: 'date', value: c.start || '' });
  const opening = h('input', { inputmode: 'decimal', value: on ? centsIn(c.opening) : '', placeholder: '0' });
  const since = h('input', { type: 'date', value: c.since || todayStr(), max: todayStr() });
  const fields = [
    h('div', { class: 'row' }, h('label', { class: 'field', style: { flex: '1' } }, 'Starting cash balance', opening), h('label', { class: 'field', style: { flex: '1' } }, 'As of', since)),
    h('p', { class: 'tiny muted' }, 'The cash you had on that date, before any A or B payment that day. Payments and spending from then on are added up for you.'),
    h('label', { class: 'field' }, 'Amount on the 1st of each month (A)', A),
    h('label', { class: 'field' }, 'Amount every 7 days (B)', B),
    h('label', { class: 'field' }, 'Date of any B payment', start),
    h('p', { class: 'tiny muted' }, 'Leave the balance and both amounts blank to stop tracking cash.'),
  ];
  const read = () => {
    const blank = (el) => el.value.trim() === '';
    if (blank(A) && blank(B) && blank(opening)) return null;
    const [a, b] = [A, B].map((el) => (blank(el) ? 0 : parseAmount(el.value)));
    if (a === null || b === null) return 'A and B must be numbers, like 8000 or 1250.50.';
    // the starting balance may be below zero
    const ov = opening.value.trim(), minus = /^[-−]/.test(ov), o = blank(opening) ? 0 : parseAmount(ov.replace(/^[-−]/, ''));
    if (o === null) return 'The starting cash balance must be a number, like 1500 or -200.';
    if (b && !isDate(start.value)) return 'Pick the date of a B payment.';
    if (!isDate(since.value)) return 'Pick the date of your starting cash balance.';
    if (since.value > todayStr()) return `The “As of” date can’t be after today (${niceDate(todayStr(), true)}). Use the day you counted your cash.`;
    return { A: a, B: b, start: b ? start.value : null, since: since.value, opening: minus ? -o : o };
  };
  return { fields, read };
}

// Shows a form error where it can't be missed: next to the button, scrolled into view, and as a message at the bottom
function showError(err, msg) {
  err.textContent = msg;
  err.scrollIntoView({ block: 'center', behavior: 'smooth' });
  toast(msg);
}

function openSettings() {
  const body = $('#settingsBody');
  const theme = h('div', { class: 'seg' }, [['dark', 'Dark'], ['light', 'Light'], ['system', 'Auto']].map(([k, l]) =>
    h('button', { type: 'button', 'aria-pressed': String(D.settings.theme === k), onclick: () => { D.settings.theme = k; persist(); applyTheme(); openSettings(); } }, l)));
  const cur = h('input', { value: D.settings.currency, maxlength: '3', autocapitalize: 'characters' });
  const cash = cashFields();
  const err = h('p', { class: 'error' });
  const version = h('p', { class: 'tiny muted' });
  body.replaceChildren(
    h('div', { class: 'grab' }),
    h('div', { class: 'between' }, h('h2', null, 'Settings'), h('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close', onclick: () => $('#settingsSheet').close() }, '✕')),
    h('div', { class: 'section-label' }, 'Theme'),
    theme,
    h('div', { class: 'section-label' }, 'Money'),
    h('label', { class: 'field' }, 'Currency (3-letter code, like USD or THB)', cur),
    ...cash.fields,
    err,
    h('button', { class: 'btn btn-primary btn-block', type: 'button', onclick: () => {
      const code = cur.value.trim().toUpperCase(), next = cash.read();
      if (!validCurrency(code)) return showError(err, 'Use a 3-letter currency code like USD or THB.');
      if (typeof next === 'string') return showError(err, next);
      D.cash = next || freshData().cash; D.settings.currency = code; setCurrency(code);
      commit(); err.textContent = ''; toast('Saved');
    } }, 'Save'),
    ...poolSettings(),
    ...slipSettings(),
    h('div', { class: 'section-label' }, 'Plan'),
    h('button', { class: 'btn btn-block', type: 'button', onclick: () => { $('#settingsSheet').close(); openPlan(); } }, `Edit budget & categories (${monthName(S.month)})`),
    h('div', { class: 'section-label' }, 'Backup'),
    h('p', { class: 'small muted' }, (D.settings.lastBackup ? `Last backup ${new Date(D.settings.lastBackup).toLocaleDateString()}. ` : 'No backup yet. ') + 'Everything is saved on this device only. Restoring replaces what’s here.'),
    h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: exportBackup }, 'Save backup'), h('button', { class: 'btn', type: 'button', onclick: () => $('#importFile').click() }, 'Restore…')),
    version);
  // the offline cache is named after the app version in sw.js
  if (window.caches) caches.keys().then((keys) => { const k = keys.find((x) => /^pocket-budget-v\d/.test(x)); if (k) version.textContent = `App version ${k.slice('pocket-budget-'.length)}`; }).catch(() => {});
  if (!$('#settingsSheet').open) $('#settingsSheet').showModal();
}

function openSetup() {
  const f = $('#setupForm');
  const cur = h('input', { maxlength: '3', autocapitalize: 'characters', placeholder: 'e.g. USD, THB, EUR' });
  const budget = h('input', { inputmode: 'decimal', placeholder: '0' });
  const cash = cashFields();
  const err = h('p', { class: 'error', role: 'alert' });
  const finish = (variable) => {
    if (!Object.keys(D.plans).length) D.plans[thisMonth()] = { ...clone(DEFAULT_PLAN), variable };
    D.settings.setupDone = true;
    $('#setupSheet').close();
  };
  f.replaceChildren(
    h('div', { class: 'grab' }),
    h('h2', null, 'Welcome to Pocket Budget'),
    h('p', { class: 'muted small' }, 'A few basics to get started. You can change all of this later in Settings and Edit plan.'),
    h('label', { class: 'field' }, 'Currency', cur),
    h('label', { class: 'field' }, 'Monthly spending budget', budget),
    h('div', { class: 'section-label' }, 'Cash (optional)'),
    ...cash.fields,
    err,
    h('button', { class: 'btn btn-primary btn-block', type: 'submit' }, 'Start'),
    h('button', { class: 'btn btn-block', type: 'button', onclick: () => { finish(0); commit(); } }, 'Skip for now'));
  f.onsubmit = (e) => {
    e.preventDefault();
    const code = cur.value.trim().toUpperCase(), v = budget.value.trim() === '' ? 0 : parseAmount(budget.value), next = cash.read();
    if (!validCurrency(code)) return showError(err, 'Enter a 3-letter currency code like USD or THB.');
    if (v === null) return showError(err, 'Enter your budget as a number, like 6000.');
    if (typeof next === 'string') return showError(err, next);
    D.settings.currency = code; setCurrency(code);
    if (next) D.cash = next;
    finish(v); commit(); toast('All set');
  };
  $('#setupSheet').showModal();
}

/* =================================================================== backup */
function backupJson() { return JSON.stringify({ app: 'pocket-budget', exported: new Date().toISOString(), data: D }, null, 1); }
async function exportBackup() {
  const name = `pocket-budget-${todayStr()}.json`;
  const file = new File([backupJson()], name, { type: 'application/json' });
  let ok = false;
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: 'Pocket Budget backup' }); ok = true; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (!ok) {
    const url = URL.createObjectURL(file);
    const a = h('a', { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  D.settings.lastBackup = Date.now(); persist(); render();
  if ($('#settingsSheet').open) openSettings();
  toast('Backup saved');
}
$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  let d;
  try { d = JSON.parse(await file.text()); } catch { toast('That file isn’t a Pocket Budget backup.'); return; }
  const data = d && d.app === 'pocket-budget' ? normalize(d.data) : null;
  if (!data) { toast('That file isn’t a Pocket Budget backup.'); return; }
  const n = Object.values(data.tx).flat().length;
  if ($('#settingsSheet').open) $('#settingsSheet').close();
  if (!(await askConfirm(`Restore the backup from ${new Date(d.exported).toLocaleDateString()} (${n} entries)? This replaces everything on this device.`, 'Restore'))) return;
  D = data;
  setCurrency(D.settings.currency); applyTheme(); commit();
  toast(`Restored ${n} entries`);
});

/* =================================================================== wiring */
$('#settingsBtn').append(icon('sliders'));
$('#addBtn').append(icon('plus'));
for (const b of document.querySelectorAll('.nav-btn')) {
  const map = { home: ['home', 'Home'], activity: ['list', 'Activity'], wallet: ['wallet', 'Cash'], stats: ['chart', 'Stats'] }[b.dataset.tab];
  b.append(icon(map[0]), map[1]);
  b.addEventListener('click', () => { S.tab = b.dataset.tab; if (S.tab !== 'activity') S.filter = ''; render(); window.scrollTo({ top: 0 }); });
}
$('#addBtn').addEventListener('click', () => openTx());
$('#settingsBtn').addEventListener('click', openSettings);
$('#prevMonth').addEventListener('click', () => { S.month = shiftMonth(S.month, -1); render(); });
$('#nextMonth').addEventListener('click', () => { S.month = shiftMonth(S.month, 1); render(); });
$('#monthLabel').addEventListener('click', () => { S.month = thisMonth(); render(); });
for (const d of document.querySelectorAll('dialog')) {
  d.addEventListener('click', (e) => {
    if (e.target !== d || d.id === 'setupSheet') return;
    const r = d.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.id === 'confirmSheet' ? $('#confirmNo').click() : d.close();
  });
}
$('#setupSheet').addEventListener('cancel', (e) => e.preventDefault());
// "Today" always comes from the phone's clock. If the date changes while the app is open (past midnight, or the
// phone's date is corrected), follow it: move on to the new month if that one was showing, then redraw.
let shownDay = todayStr();
function checkDay() {
  const t = todayStr();
  if (t === shownDay) return;
  if (S.month === shownDay.slice(0, 7)) S.month = t.slice(0, 7);
  shownDay = t;
  if (!document.querySelector('dialog[open]')) render();
}
setInterval(checkDay, 30000);
document.addEventListener('visibilitychange', () => { if (document.hidden) return; checkDay(); if (!document.querySelector('dialog[open]')) render(); });

applyTheme();
render();
slipShared();
if (!D.settings.setupDone) openSetup();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch { /* optional */ }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
