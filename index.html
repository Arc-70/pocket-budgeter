<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Budget</title>
<meta name="description" content="Track spending, monthly budgets and your cash schedule. Everything stays on this device.">
<meta name="theme-color" content="#0a0c18">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Layout: one phone-width column of glass panels; month bar on top, tab bar with a raised + button at the bottom. */
:root {
  --bg: #eef1f8;
  --glow-1: rgba(118, 104, 255, .16);
  --glow-2: rgba(25, 195, 216, .14);
  --card: rgba(255, 255, 255, .82);
  --card-solid: #ffffff;
  --line: rgba(20, 30, 70, .09);
  --ink: #141a2e;
  --muted: #687090;
  --track: rgba(20, 30, 70, .08);
  --chip: rgba(20, 30, 70, .06);
  --nav: rgba(255, 255, 255, .88);
  --accent: #6b5cff;
  --accent-2: #12b8d1;
  --good: #14a067;
  --warn: #d4920a;
  --bad: #e0443a;
  --scrim: rgba(10, 14, 30, .45);
  --shadow: 0 10px 28px rgba(30, 40, 100, .09);
  --glow-shadow: 0 0 0 transparent;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
  --font-display: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI Variable Display", system-ui, sans-serif;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0c18; --glow-1: rgba(124, 92, 255, .26); --glow-2: rgba(0, 200, 225, .14);
    --card: rgba(255, 255, 255, .055); --card-solid: #151829; --line: rgba(255, 255, 255, .09);
    --ink: #eef0ff; --muted: #9298b9; --track: rgba(255, 255, 255, .09); --chip: rgba(255, 255, 255, .07);
    --nav: rgba(16, 18, 34, .84); --accent: #8b7bff; --accent-2: #38d9ef;
    --good: #4ade80; --warn: #fbbf24; --bad: #ff6b6b; --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 12px 32px rgba(0, 0, 0, .35); --glow-shadow: 0 0 18px rgba(139, 123, 255, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0c18; --glow-1: rgba(124, 92, 255, .26); --glow-2: rgba(0, 200, 225, .14);
  --card: rgba(255, 255, 255, .055); --card-solid: #151829; --line: rgba(255, 255, 255, .09);
  --ink: #eef0ff; --muted: #9298b9; --track: rgba(255, 255, 255, .09); --chip: rgba(255, 255, 255, .07);
  --nav: rgba(16, 18, 34, .84); --accent: #8b7bff; --accent-2: #38d9ef;
  --good: #4ade80; --warn: #fbbf24; --bad: #ff6b6b; --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 12px 32px rgba(0, 0, 0, .35); --glow-shadow: 0 0 18px rgba(139, 123, 255, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body {
  min-height: 100vh; color: var(--ink); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(60% 40% at 0% 0%, var(--glow-1), transparent 70%),
    radial-gradient(50% 35% at 100% 30%, var(--glow-2), transparent 70%),
    var(--bg);
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3, p { margin: 0; }
h2 { font: 700 1.2rem/1.2 var(--font-display); }
h3 { font: 700 1rem/1.25 var(--font-display); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.tiny { font-size: .74rem; }
.good { color: var(--good); } .warn { color: var(--warn); } .bad { color: var(--bad); }
.row { display: flex; align-items: center; gap: 8px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.spacer { flex: 1; }
.ico { width: 22px; height: 22px; flex: none; }
.ico-sm { width: 18px; height: 18px; flex: none; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding-block: 10px; background: linear-gradient(var(--bg) 70%, transparent); }
.top .wrap { display: flex; align-items: center; gap: 6px; }
.month-pill {
  display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.month-pill button { font: inherit; border: 0; background: transparent; color: var(--ink); cursor: pointer; border-radius: 999px; }
.month-pill .arrow { width: 34px; height: 34px; font-size: 1.15rem; }
.month-pill .label { font: 700 .98rem var(--font-display); padding: 6px 8px; min-width: 128px; }
.month-pill button:hover { background: var(--chip); }
.icon-btn {
  width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; cursor: pointer; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.icon-btn:hover { filter: brightness(1.1); }
.streak-chip {
  display: flex; align-items: center; gap: 4px; padding: 7px 11px; border-radius: 999px; font-weight: 800;
  background: linear-gradient(135deg, rgba(255, 140, 50, .22), rgba(255, 70, 120, .18)); color: #ff8a3d; border: 1px solid rgba(255, 138, 61, .35);
}

main.wrap { padding-block: 4px 130px; display: flex; flex-direction: column; gap: 14px; }

/* Glass panels */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px;
  box-shadow: var(--shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  display: flex; flex-direction: column; gap: 12px; min-width: 0;
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.link-btn { font: inherit; font-weight: 700; font-size: .85rem; color: var(--accent); background: transparent; border: 0; cursor: pointer; padding: 6px 4px; }

/* Remaining ring */
.ring-card { align-items: center; text-align: center; padding-block: 20px 16px; }
.ring { position: relative; width: min(230px, 64vw); aspect-ratio: 1; max-width: 100%; }
.ring svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.ring .lbl { font-size: .82rem; color: var(--muted); font-weight: 600; }
.ring .amt { font: 800 clamp(1.7rem, 8.5vw, 2.2rem)/1.05 var(--font-display); letter-spacing: -.02em; }
.ring .of { font-size: .8rem; color: var(--muted); }
.ring-stats { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; gap: 6px; padding-top: 4px; }
.ring-stats div { display: flex; flex-direction: column; gap: 1px; }
.ring-stats b { font-size: 1rem; font-variant-numeric: tabular-nums; }

/* Quest card */
.quest-top { display: flex; align-items: center; gap: 12px; }
.level-badge {
  width: 52px; height: 52px; border-radius: 16px; flex: none; display: grid; place-items: center; text-align: center;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: var(--glow-shadow);
  font: 800 1.25rem/1 var(--font-display);
}
.level-badge small { display: block; font-size: .58rem; letter-spacing: .08em; font-weight: 700; opacity: .9; }
.xp-bar { height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
.xp-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #ff4f8b, #ffb84f, #4fe3c1, #6b8cff); }
.journey svg { width: 100%; height: auto; display: block; overflow: visible; }
.journey text { fill: var(--muted); font: 600 10px var(--font); }

/* Category tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile {
  position: relative; text-align: left; font: inherit; color: var(--ink); cursor: pointer; overflow: hidden;
  border-radius: 20px; padding: 13px; display: flex; flex-direction: column; gap: 8px; min-width: 0;
  border: 1px solid var(--line); background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.tile::before { content: ""; position: absolute; inset: 0; background: var(--c); opacity: .12; pointer-events: none; }
.tile > * { position: relative; }
.tile-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.tile-ico { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: var(--c); box-shadow: 0 0 14px color-mix(in srgb, var(--c) 45%, transparent); }
.tile-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-amt { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .spark { width: 64px; height: 24px; }
.nw { font-size: .66rem; font-weight: 800; letter-spacing: .06em; padding: 2px 7px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.nw.want { color: #f472b6; }
.nw.need { color: #22d3ee; }
.bar { height: 7px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--c); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 60%, transparent); }
.bar i.warn { background: var(--warn); box-shadow: none; }
.bar i.over { background: var(--bad); box-shadow: none; }
.tile-note { font-size: .72rem; color: var(--muted); }
.tile-note.over { color: var(--bad); font-weight: 700; }

.fixed-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.fixed {
  display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-radius: 16px; border: 1px solid var(--line);
  background: var(--chip); font: inherit; color: var(--ink); text-align: left; cursor: pointer; min-width: 0;
}
.fixed .meta { flex: 1; min-width: 0; }
.fixed .meta div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; flex: none; }
.check.on { background: var(--good); border-color: var(--good); color: #fff; }

/* Activity list */
.tx-group { display: flex; flex-direction: column; }
.tx-day { display: flex; justify-content: space-between; padding: 10px 4px 6px; font-size: .74rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tx-list { border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--card); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.tx {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 14px; min-height: 58px;
  font: inherit; color: inherit; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; cursor: pointer;
}
.tx:first-child { border-top: 0; }
.tx:hover { background: var(--chip); }
.tx-ico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; color: var(--c); background: color-mix(in srgb, var(--c) 18%, transparent); }
.tx-meta { flex: 1; min-width: 0; }
.tx-title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-sub { font-size: .8rem; color: var(--muted); }
.tx-amt { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; font: inherit; font-size: .84rem; font-weight: 700; padding: 7px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--card); color: var(--muted);
}
.chip[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Stats */
.donut-wrap { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 14px; align-items: center; }
.donut-wrap svg { width: 150px; height: 150px; transform: rotate(-90deg); }
.legend { display: flex; flex-direction: column; gap: 7px; font-size: .85rem; min-width: 0; }
.legend div { display: flex; align-items: center; gap: 8px; min-width: 0; }
.legend span:nth-child(2) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 8px var(--c); }
.bva { display: flex; flex-direction: column; gap: 14px; }
.bva-row { display: flex; flex-direction: column; gap: 5px; }
.bva-row .between { font-size: .88rem; }
.ratio { display: flex; gap: 12px; font-size: .74rem; color: var(--muted); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; font-size: .92rem; }
.kv b { text-align: right; font-variant-numeric: tabular-nums; }
.kv .total { border-top: 1px solid var(--line); padding-top: 7px; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font: 10.5px var(--font); }
.chart .grid { stroke: var(--line); }
.split { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: var(--track); }
.split i { display: block; height: 100%; }
.leg-row { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.leg-row span { display: inline-flex; align-items: center; gap: 6px; }
.leg-row i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }

/* Wallet */
.cash-hero { background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 30%, var(--card)), color-mix(in srgb, var(--accent-2) 22%, var(--card))); }
.big { font: 800 clamp(2rem, 10vw, 2.5rem)/1.05 var(--font-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.countdown { display: flex; align-items: center; gap: 14px; }
.countdown .days {
  width: 76px; height: 76px; border-radius: 22px; flex: none; display: grid; place-items: center; text-align: center;
  background: var(--chip); border: 1px solid var(--line); font: 800 1.7rem/1 var(--font-display);
}
.countdown .days small { display: block; font: 700 .64rem var(--font); color: var(--muted); letter-spacing: .06em; margin-top: 3px; }
.pay { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.pay:first-child { border-top: 0; }
.pay-tag { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font: 800 .95rem var(--font-display); flex: none; }
.pay-tag.A { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.pay-tag.B { background: color-mix(in srgb, var(--accent-2) 22%, transparent); color: var(--accent-2); }
.status { font-size: .74rem; font-weight: 800; padding: 3px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.status.got { color: var(--good); }
.status.next { color: var(--accent-2); }
.badge5 { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; font-size: .84rem; font-weight: 700; background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }

/* Achievements */
.ach-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ach { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 12px 6px; border-radius: 18px; background: var(--chip); border: 1px solid var(--line); }
.ach .medal { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 0 16px color-mix(in srgb, var(--c1) 55%, transparent); }
.ach.locked .medal { background: var(--track); color: var(--muted); box-shadow: none; }
.ach b { font-size: .78rem; line-height: 1.2; }
.ach span { font-size: .68rem; color: var(--muted); line-height: 1.25; }

.empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: .9rem; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.notice { padding: 12px 14px; border-radius: 16px; font-size: .86rem; background: color-mix(in srgb, var(--warn) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); }

/* Buttons & inputs */
.btn {
  font: inherit; font-weight: 700; min-height: 46px; padding: 0 18px; border-radius: 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--chip); color: var(--ink);
}
.btn:hover { filter: brightness(1.08); }
.btn-primary { border: 0; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: var(--glow-shadow); }
.btn-danger { background: transparent; color: var(--bad); border-color: transparent; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: .85rem; border-radius: 11px; }
.btn-block { width: 100%; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; font-weight: 700; color: var(--muted); min-width: 0; }
input, select {
  font: inherit; color: var(--ink); background: var(--chip); border: 1px solid var(--line); border-radius: 13px;
  min-height: 46px; padding: 10px 12px; width: 100%; min-width: 0;
}
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 15px; background: var(--chip); }
.seg button { flex: 1; font: inherit; font-weight: 700; padding: 9px 8px; border-radius: 11px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed=true] { background: var(--card-solid); color: var(--ink); box-shadow: var(--shadow); }
.switch { position: relative; width: 52px; height: 30px; border-radius: 99px; background: var(--track); border: 0; cursor: pointer; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); transition: transform .2s; }
.switch[aria-checked=true] { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.switch[aria-checked=true]::after { transform: translateX(22px); }
.amount-input { font: 800 2.2rem/1 var(--font-display); text-align: center; min-height: 64px; letter-spacing: -.02em; }
.cat-pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.cat-pick button {
  font: inherit; font-size: .8rem; font-weight: 700; color: var(--ink); cursor: pointer; padding: 10px 4px; border-radius: 15px;
  display: flex; flex-direction: column; align-items: center; gap: 5px; background: var(--chip); border: 2px solid transparent; min-width: 0;
}
.cat-pick button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-pick button i { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff; background: var(--c); }
.cat-pick button[aria-pressed=true] { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); }
.zero-btn { display: flex; align-items: center; justify-content: center; gap: 8px; }

/* Plan editor */
.plan-cat { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-radius: 16px; background: var(--chip); border: 1px solid var(--line); }
.plan-cat .line { display: grid; grid-template-columns: 44px minmax(0, 1fr) 110px; gap: 8px; align-items: center; }
.plan-cat .line2 { display: flex; gap: 8px; align-items: center; }
.swatch-btn { width: 44px; height: 44px; border-radius: 13px; border: 0; display: grid; place-items: center; color: #fff; background: var(--c); cursor: pointer; }
.picker { display: flex; flex-direction: column; gap: 8px; }
.picker .icons, .picker .colors { display: flex; flex-wrap: wrap; gap: 6px; }
.picker .icons button { width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--line); background: var(--card-solid); color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.picker .colors button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid transparent; background: var(--c); cursor: pointer; }
.picker button[aria-pressed=true] { outline: 2px solid var(--accent); outline-offset: 1px; }
.fixed-line { display: grid; grid-template-columns: minmax(0, 1fr) 120px 40px; gap: 8px; align-items: center; }
.x-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; color: var(--bad); font-size: 1.1rem; cursor: pointer; }
.checkline { font-size: .86rem; font-weight: 700; padding: 10px 12px; border-radius: 13px; background: var(--chip); }

/* Bottom nav */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.nav-inner {
  max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  background: var(--nav); border: 1px solid var(--line); border-radius: 24px; padding: 6px; box-shadow: var(--shadow);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
}
.nav-btn { font: inherit; font-size: .66rem; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border: 0; background: transparent; color: var(--muted); cursor: pointer; border-radius: 16px; }
.nav-btn[aria-current=page] { color: var(--ink); background: var(--chip); }
.nav-btn[aria-current=page] svg { color: var(--accent); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 60%, transparent)); }
.plus {
  justify-self: center; width: 58px; height: 58px; margin-top: -26px; border-radius: 20px; border: 0; cursor: pointer; color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 50%, transparent);
}
.plus svg { width: 28px; height: 28px; }

/* Sheets */
dialog {
  width: 100%; max-width: 560px; max-height: 92dvh; margin: auto auto 0; padding: 0; overflow: hidden;
  border: 1px solid var(--line); border-bottom: 0; border-radius: 26px 26px 0 0; background: var(--card-solid); color: var(--ink);
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .35);
}
dialog.center { margin: auto; border-radius: 22px; border-bottom: 1px solid var(--line); width: min(420px, calc(100% - 32px)); }
dialog::backdrop { background: var(--scrim); backdrop-filter: blur(3px); }
.sheet { display: flex; flex-direction: column; gap: 14px; padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; max-height: 92dvh; }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--track); align-self: center; margin-top: -6px; }
.section-label { font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.error { color: var(--bad); font-size: .86rem; min-height: 1.1em; }

.toast {
  position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); z-index: 30; transform: translate(-50%, 14px); opacity: 0;
  transition: opacity .2s, transform .2s; pointer-events: none; padding: 11px 16px; border-radius: 14px; font-weight: 700; font-size: .9rem;
  background: var(--ink); color: var(--bg); max-width: calc(100vw - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

      <button class="arrow" id="prevMonth" aria-label="Previous month">‹</button>

<main class="wrap" id="view"></main>

<nav class="nav" aria-label="Main">

</div></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

}

  for (const c of kids.flat()) if (c !== null && c !== undefined) el.append(c.nodeType ? c : String(c));

}

const pad = (n) => String(n).padStart(2, '0');

/* dates (local calendar dates as YYYY-MM-DD strings) */
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };

const utc = (d) => { const [y, m, dd] = d.split('-').map(Number); return Date.UTC(y, m - 1, dd); };
const fromUtc = (t) => { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; };
const addDays = (d, n) => fromUtc(utc(d) + n * 864e5);
const daysBetween = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
const daysIn = (m) => { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); };
function shiftMonth(m, n) { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }

function niceDate(d, withDay) { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd).toLocaleDateString(undefined, withDay ? { weekday: 'short', day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short' }); }
function dayLabel(d) {
  const t = todayStr();
  if (d === t) return 'Today';
  if (d === addDays(t, -1)) return 'Yesterday';
  return niceDate(d, true);
}

/* money: stored as integer satang/cents */
function parseAmount(v) {
  const t = String(v ?? '').trim().replace(/[,\s฿$]/g, '');
  if (!/^\d{1,9}(\.\d{1,2})?$/.test(t)) return null;
  const [w, f = ''] = t.split('.');
  return Number(w) * 100 + Number((f + '00').slice(0, 2));
}

    F.full = new Intl.NumberFormat(undefined, base);

  } catch { if (code !== 'THB') setCurrency('THB'); }
}

const moneyW = (c) => (Math.abs(c) >= 100000 || c % 100 === 0 ? F.whole : F.full).format(c / 100);
const moneyS = (c) => F.short.format(c / 100);
const centsIn = (c) => (c || c === 0 ? String(c / 100) : '');

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }
function askConfirm(text, ok) {
  return new Promise((resolve) => {
    const d = $('#confirmSheet');

}

};
const CAT_ICONS = ['cart', 'food', 'cup', 'bus', 'bolt', 'box', 'users', 'heart', 'game', 'book', 'gift', 'shirt', 'plane', 'home', 'phone', 'coin'];
function icon(name, cls) {
  const el = document.createElementNS(NS, 'svg');
  el.setAttribute('viewBox', '0 0 24 24'); el.setAttribute('fill', 'none'); el.setAttribute('stroke', 'currentColor');
  el.setAttribute('stroke-width', '1.9'); el.setAttribute('stroke-linecap', 'round'); el.setAttribute('stroke-linejoin', 'round');

}
const COLORS = { cyan: '#22d3ee', green: '#34d399', amber: '#f5b324', violet: '#a78bfa', pink: '#f472b6', blue: '#60a5fa', orange: '#fb923c', red: '#f87171', teal: '#2dd4bf', lime: '#a3e635' };
const colorOf = (c) => COLORS[c] || c || '#94a3b8';

/* =================================================================== data */
const KEY = 'pocket-budget-v2';
const DEFAULT_PLAN = {
  variable: 600000,
  fixed: [{ id: 'rent', name: 'Rent', amount: 750000, icon: 'home' }, { id: 'phone', name: 'Phone', amount: 64200, icon: 'phone' }],
  cats: [

    { id: 'cola', name: 'Cola', type: 'want', budget: 50000, icon: 'cup', color: 'pink' },

    { id: 'allowance', name: 'Allowance', type: 'want', budget: 250000, icon: 'bolt', color: 'violet' },
    { id: 'others', name: 'Others', type: 'need', budget: 60000, icon: 'box', color: 'amber' },

};
function freshData() {
  return {
    v: 2,
    settings: { currency: 'THB', theme: 'dark', game: true, setupDone: false, lastBackup: 0, unlocked: {} },
    cash: { X: 2000000, A: null, start: '2026-11-01' },
    plans: {},  // 'YYYY-MM' -> plan; a month without one uses the latest earlier plan
    paid: {},   // 'YYYY-MM' -> { fixedId: true }
    tx: {},     // 'YYYY-MM' -> [{ id, date, note, cat, amount, zero?, created }]
  };

let D = freshData();
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const d = JSON.parse(raw); if (d && d.v === 2) D = Object.assign(freshData(), d); }
} catch { /* start fresh */ }
setCurrency(D.settings.currency);

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(D)); }
  catch { toast("Your phone isn't letting the app save. Changes will be lost when you close it."); }
}
function commit() { persist(); checkAchievements(); render(); }

function planFor(m) {
  if (D.plans[m]) return D.plans[m];
  const earlier = Object.keys(D.plans).filter((k) => k < m).sort();
  if (earlier.length) return D.plans[earlier[earlier.length - 1]];
  const later = Object.keys(D.plans).sort();
  return later.length ? D.plans[later[0]] : DEFAULT_PLAN;
}
function catInfo(id, m) {
  const p = planFor(m);
  let c = p.cats.find((x) => x.id === id);
  if (!c) for (const k of Object.keys(D.plans)) { c = D.plans[k].cats.find((x) => x.id === id); if (c) break; }
  return c || { id: null, name: 'Uncategorized', icon: 'box', color: '#94a3b8', type: 'need', budget: 0 };
}
const txOf = (m) => D.tx[m] || [];
const spentOf = (list) => list.reduce((a, t) => a + (t.amount || 0), 0);
const dailyTarget = (m) => Math.round(planFor(m).variable / daysIn(m));
const fixedTotal = (p) => p.fixed.reduce((a, f) => a + f.amount, 0);
const catsTotal = (p) => p.cats.reduce((a, c) => a + c.budget, 0);

/* -------- cash schedule: A on the 1st, B every 7 days from the start date */
const bAmount = () => (D.cash.A === null ? 0 : Math.round((D.cash.X - D.cash.A) / 4));
function payments(m) {
  const c = D.cash;
  if (c.A === null || !c.start) return [];
  const startM = c.start.slice(0, 7);
  if (m < startM) return [];
  const first = `${m}-01`, last = `${m}-${pad(daysIn(m))}`;
  const out = [];
  if (first >= `${startM}-01`) out.push({ date: first, kind: 'A', amount: c.A });
  let k = Math.max(0, Math.ceil(daysBetween(c.start, first) / 7));
  for (;; k++) {
    const d = addDays(c.start, 7 * k);
    if (d > last) break;
    if (d >= first) out.push({ date: d, kind: 'B', amount: bAmount() });
  }
  return out.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.kind < b.kind ? -1 : 1));
}
function nextB(from) {
  const c = D.cash;
  if (c.A === null || !c.start) return null;
  if (c.start >= from) return c.start;
  return addDays(c.start, 7 * Math.ceil(daysBetween(c.start, from) / 7));
}
const bCount = (m) => payments(m).filter((p) => p.kind === 'B').length;
function cashFor(m) {
  const t = todayStr();
  const pays = payments(m);
  const received = pays.filter((p) => p.date <= t).reduce((a, p) => a + p.amount, 0);
  const spent = spentOf(txOf(m).filter((x) => x.date <= t || m < thisMonth()));
  return { pays, received, spent, balance: received - spent };
}
function cashAllTime() {
  const c = D.cash;
  if (c.A === null) return null;
  let m = c.start.slice(0, 7), total = 0;
  const end = thisMonth();
  while (m <= end) { total += cashFor(m).balance; m = shiftMonth(m, 1); }
  return total;
}

/* -------- streaks & game */
function dayStat(date) {
  const list = txOf(date.slice(0, 7)).filter((t) => t.date === date);
  if (!list.length) return { logged: false };
  const spent = spentOf(list);
  return { logged: true, spent, under: spent <= dailyTarget(date.slice(0, 7)), zero: list.some((t) => t.zero) };
}
let gameCache = null;
function game() {
  if (gameCache) return gameCache;
  const t = todayStr();
  const allDates = Object.values(D.tx).flat().map((x) => x.date).filter((d) => d <= t).sort();
  const res = { current: 0, best: 0, underDays: 0, zeroDays: 0, monthsUnder: 0, zeroMonthMax: 0, starWeeks: 0, any: allDates.length > 0 };
  if (allDates.length) {
    let run = 0;
    for (let d = allDates[0]; d <= t; d = addDays(d, 1)) {
      const st = dayStat(d);
      if (st.logged && st.under) { run++; res.underDays++; res.best = Math.max(res.best, run); }
      else if (d === t && !st.logged) { /* today not logged yet: streak still alive */ }
      else run = 0;
      if (st.zero) res.zeroDays++;
    }
    res.current = run;
  }
  for (const m of Object.keys(D.tx)) {
    const list = txOf(m);
    if (!list.length) continue;

    h('div', { class: 'section-label' }, 'Money'),
    h('label', { class: 'field' }, 'Monthly money (X)', X),
    h('label', { class: 'field' }, 'Amount on the 1st (A)', A),
    h('label', { class: 'field' }, 'First B payment date', start),
    bPrev, err,
    h('div', { class: 'row' }, h('label', { class: 'field', style: { flex: 'none' } }, 'Currency', cur), h('span', { class: 'spacer' }),
      h('button', { class: 'btn btn-primary', type: 'button', onclick: () => {
        const x = parseAmount(X.value), a = parseAmount(A.value), code = cur.value.trim().toUpperCase();
        if (x === null || !x) { err.textContent = 'Enter your monthly money.'; return; }
        if (a === null || a > x) { err.textContent = 'A must be a number no bigger than X.'; return; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(start.value)) { err.textContent = 'Pick the first B date.'; return; }
        try { new Intl.NumberFormat(undefined, { style: 'currency', currency: code }); } catch { err.textContent = 'Use a 3-letter currency code like THB.'; return; }
        Object.assign(D.cash, { X: x, A: a, start: start.value }); D.settings.currency = code; setCurrency(code);
        commit(); err.textContent = ''; toast('Saved');
      } }, 'Save')),
    h('div', { class: 'section-label' }, 'Plan'),
    h('button', { class: 'btn btn-block', type: 'button', onclick: () => { $('#settingsSheet').close(); openPlan(); } }, `Edit budget & categories (${monthName(S.month)})`),
    h('div', { class: 'section-label' }, 'Backup'),
    h('p', { class: 'small muted' }, (D.settings.lastBackup ? `Last backup ${new Date(D.settings.lastBackup).toLocaleDateString()}. ` : 'No backup yet. ') + 'Everything is saved on this phone only. Restoring replaces what’s here.'),
    h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: exportBackup }, 'Save backup'), h('button', { class: 'btn', type: 'button', onclick: () => $('#importFile').click() }, 'Restore…')));
  if (!$('#settingsSheet').open) $('#settingsSheet').showModal();
}

function openSetup() {
  const f = $('#setupForm');
  const c = D.cash;
  const X = h('input', { id: 'suX', inputmode: 'decimal', value: centsIn(c.X) });
  const A = h('input', { id: 'suA', inputmode: 'decimal', value: centsIn(c.A), placeholder: 'e.g. 8000' });
  const start = h('input', { id: 'suStart', type: 'date', value: c.start });
  const bPrev = h('div', { class: 'checkline num' });
  const upd = () => { const x = parseAmount(X.value), a = parseAmount(A.value); bPrev.textContent = x !== null && a !== null && a <= x ? `B = (X − A) ÷ 4 = ${money(Math.round((x - a) / 4))}, every 7 days` : 'B = (X − A) ÷ 4'; };
  X.addEventListener('input', upd); A.addEventListener('input', upd); upd();
  const err = h('p', { class: 'error' });
  f.replaceChildren(
    h('div', { class: 'grab' }),
    h('div', { class: 'row' }, h('span', { class: 'level-badge', style: { width: '44px', height: '44px', borderRadius: '14px' } }, icon('wallet')), h('h2', null, 'Welcome to Pocket Budget')),
    h('p', { class: 'muted small' }, 'Your budget from your spreadsheet is already filled in (rent, phone, 6,000 spending budget and your six categories). You can change it any time. First, your cash:'),
    h('label', { class: 'field' }, 'Money you get each month (X)', X),
    h('label', { class: 'field' }, 'Amount you get on the 1st (A)', A),
    h('label', { class: 'field' }, 'Date of your first B payment', start),
    bPrev, err,
    h('button', { class: 'btn btn-primary btn-block', type: 'submit' }, 'Start'),
    h('button', { class: 'btn btn-block', type: 'button', onclick: () => { D.settings.setupDone = true; persist(); $('#setupSheet').close(); render(); } }, 'Skip for now'));
  f.onsubmit = (e) => {
    e.preventDefault();
    const x = parseAmount(X.value), a = parseAmount(A.value);
    if (!x) { err.textContent = 'Enter how much you get each month.'; return; }
    if (a === null || a > x) { err.textContent = 'Enter A: a number no bigger than X.'; return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(start.value)) { err.textContent = 'Pick the date of your first B payment.'; return; }
    Object.assign(D.cash, { X: x, A: a, start: start.value });
    D.settings.setupDone = true;
    $('#setupSheet').close(); commit(); toast('All set');
  };
  $('#setupSheet').showModal();
}

/* =================================================================== backup */
function backupJson() { return JSON.stringify({ app: 'pocket-budget', exported: new Date().toISOString(), data: D }, null, 1); }
async function exportBackup() {
  const name = `pocket-budget-${todayStr()}.json`;
  const file = new File([backupJson()], name, { type: 'application/json' });
  let ok = false;
  if (navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
    try { await navigator.share({ files: [file], title: 'Pocket Budget backup' }); ok = true; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (!ok) {
    const url = URL.createObjectURL(file);
    const a = h('a', { href: url, download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
  D.settings.lastBackup = Date.now(); persist(); render();
  if ($('#settingsSheet').open) openSettings();
  toast('Backup saved');
}
$('#importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  let d;
  try { d = JSON.parse(await file.text()); } catch { toast('That file isn’t a Pocket Budget backup.'); return; }
  if (!d || d.app !== 'pocket-budget' || !d.data || d.data.v !== 2) { toast('That file isn’t a Pocket Budget backup.'); return; }
  const n = Object.values(d.data.tx || {}).flat().length;
  if ($('#settingsSheet').open) $('#settingsSheet').close();
  if (!(await askConfirm(`Restore the backup from ${new Date(d.exported).toLocaleDateString()} (${n} entries)? This replaces everything on this phone.`, 'Restore'))) return;
  D = Object.assign(freshData(), d.data);
  setCurrency(D.settings.currency); applyTheme(); commit();
  toast(`Restored ${n} entries`);
});

/* =================================================================== wiring */
$('#settingsBtn').append(icon('sliders'));
$('#addBtn').append(icon('plus'));
for (const b of document.querySelectorAll('.nav-btn')) {
  const map = { home: ['home', 'Home'], activity: ['list', 'Activity'], wallet: ['wallet', 'Cash'], stats: ['chart', 'Stats'] }[b.dataset.tab];
  b.append(icon(map[0]), map[1]);
  b.addEventListener('click', () => { S.tab = b.dataset.tab; if (S.tab !== 'activity') S.filter = ''; render(); window.scrollTo({ top: 0 }); });
}
$('#addBtn').addEventListener('click', () => openTx());
$('#settingsBtn').addEventListener('click', openSettings);
$('#prevMonth').addEventListener('click', () => { S.month = shiftMonth(S.month, -1); render(); });
$('#nextMonth').addEventListener('click', () => { S.month = shiftMonth(S.month, 1); render(); });
$('#monthLabel').addEventListener('click', () => { S.month = thisMonth(); render(); });
for (const d of document.querySelectorAll('dialog')) {
  d.addEventListener('click', (e) => {
    if (e.target !== d || d.id === 'setupSheet') return;
    const r = d.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.id === 'confirmSheet' ? $('#confirmNo').click() : d.close();
  });
}
$('#setupSheet').addEventListener('cancel', (e) => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.querySelector('dialog[open]')) render(); });

applyTheme();
checkAchievements();
render();
if (!D.settings.setupDone) openSetup();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch { /* optional */ }
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
